server:
  host: localhost
  port: 8080

database:
  host: 127.0.0.1
  port: 3306
  user: root
  password: 123456
  name: bookstore

redis:
  host: 127.0.0.1
  port: 6379
  password: ""
  db: 0

kafka:
  brokers:
    - 127.0.0.1:9092
  topic: order-create
  group_id: order-service

minio:
  endpoint: 127.0.0.1:9000
  access_key: minioadmin
  secret_key: minioadmin
  bucket: bookstore
  use_ssl: false
  # 返回给浏览器访问图片的地址（与 SDK 内部连接的 endpoint 分离）
  public_base_url: http://localhost:9000

internal:
  # Agent 向量库增量同步接口（GET /internal/books/sync）共享密钥；
  # 为空时该接口禁用。生产环境必须改为强随机值
  sync_secret: ""

